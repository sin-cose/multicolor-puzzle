<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>彩砖谜题 · S2 场景预览</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f0e9;
      --muted: #b8b7b1;
      --panel: #202228;
      --line: #575960;
      --accent: #f0d778;
      --land: rgb(129, 163, 219);
      --bridge: rgb(175, 123, 37);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: #111216;
      font: 15px/1.5 "Courier New", monospace;
    }
    main { width: min(1100px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    header p { margin: 5px 0 0; color: var(--muted); }
    .state { padding: 5px 9px; border: 1px solid #6b6d72; color: var(--accent); white-space: nowrap; }
    .frame { padding: 10px; border: 1px solid #686a70; background: #08090c; box-shadow: 0 18px 55px #0009; }
    .world {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #050609;
    }
    .mist {
      position: absolute;
      inset: 0;
      z-index: -3;
      background: #050609;
    }
    .cliff-face {
      position: absolute;
      z-index: 0;
      background-color: #34373d;
      background-image: repeating-linear-gradient(135deg, #34373d 0 18px, #292c32 18px 35px, #3b3e43 35px 43px);
      border-top: 3px solid #63666c;
    }
    .cliff-face.main { left: 27%; top: 78%; width: 69%; height: 19%; clip-path: polygon(0 0,100% 0,100% 82%,94% 91%,88% 86%,82% 100%,74% 89%,66% 96%,58% 86%,50% 100%,42% 90%,34% 97%,26% 87%,18% 100%,10% 89%,5% 94%,0 83%); }
    .cliff-face.start { left: 4%; top: 53%; width: 16%; height: 14%; background-image: linear-gradient(180deg, #34373d, #2c2f34); clip-path: polygon(0 0,100% 0,100% 82%,91% 92%,80% 87%,68% 100%,55% 88%,43% 96%,30% 85%,17% 100%,7% 89%,0 94%); }
    .cliff-face.side { left: 25%; top: 20%; width: 3%; height: 59%; clip-path: polygon(0 0,100% 2%,100% 100%,0 96%); }
    .land {
      position: absolute;
      z-index: 1;
      border: 0;
      background-color: var(--land);
      box-shadow: inset 0 5px 0 #9eb8e3, 4px 5px 0 #17181b;
    }
    .land.main { left: 27%; top: 20%; width: 69%; height: 59%; }
    .land.start { left: 4%; top: 39%; width: 16%; height: 14%; }
    .bridge {
      position: absolute;
      z-index: 2;
      left: 19%;
      top: 45.67%;
      width: 10%;
      height: 8.67%;
      transform: translateY(-50%);
      border-block: 2px solid #d2ae69;
      background-color: var(--bridge);
      background-image: repeating-linear-gradient(90deg, #c58e36 0 27px, #9c6d22 27px 30px);
      box-shadow: 0 5px 0 #17181b;
    }
    .board {
      position: absolute;
      z-index: 3;
      left: 29%;
      top: 24%;
      width: 54%;
      height: 52%;
      display: grid;
      grid-template: repeat(6, 1fr) / repeat(8, 1fr);
      border: 3px solid #b4b5b7;
      box-shadow: 0 0 0 4px #202125, 0 8px 0 #17181b;
      overflow: hidden;
    }
    .tile {
      min-width: 0;
      border: 1px solid #6c6e71;
      background: #97999c;
      box-shadow: inset 0 0 0 1px #b4b5b7;
    }
    .tile:nth-child(8n+2), .tile:nth-child(8n+5), .tile:nth-child(8n+7) { background: #85878a; }
    .tile:nth-child(16n+3), .tile:nth-child(16n+8), .tile:nth-child(16n+10) { background: #a2a4a6; }
    .traveler {
      position: absolute;
      z-index: 5;
      left: 18%;
      top: 45.67%;
      width: clamp(12px, 3.2vw, 38px);
      height: clamp(14px, 4.3vw, 50px);
      display: grid;
      place-items: center;
      color: #fff;
      background: #5d5362;
      border: 2px solid #f2e8ce;
      box-shadow: 3px 3px 0 #151619;
      font-size: clamp(7px, 1.1vw, 12px);
      transform: translate(-50%, -50%);
    }
    .traveler::after { content: "旅"; }
    .caption { display: flex; justify-content: space-between; gap: 20px; padding: 13px 3px 2px; color: var(--muted); }
    .caption strong { color: var(--accent); font-weight: 400; }
    .key { display: inline-block; width: 11px; height: 11px; margin-right: 6px; background: #999b9e; border: 1px solid #d0d0d0; vertical-align: -1px; }
    @media (max-width: 650px) {
      body { padding: 16px 10px; }
      header { align-items: start; flex-direction: column; gap: 8px; }
      .world { aspect-ratio: 16 / 9; }
      .land.start { left: 4%; width: 16%; }
      .land.main { left: 27%; width: 69%; }
      .cliff-face.main { left: 27%; width: 69%; }
      .board { left: 29%; width: 54%; }
      .traveler { left: 18%; top: 45.67%; }
      .caption { flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>彩砖谜题 · S2 场景构图</h1><p>上桥前的灰度谜题区</p></div>
      <span class="state">S2 / 未启动</span>
    </header>
    <div class="frame">
      <section class="world" aria-label="灰度桥梁谜题场景">
        <div class="mist"></div>
        <div class="cliff-face main"></div>
        <div class="cliff-face start"></div>
        <div class="cliff-face side"></div>
        <div class="land main"></div>
        <div class="land start"></div>
        <div class="bridge"></div>
        <div class="board" id="board" aria-label="六行八列灰度砖"></div>
        <div class="traveler" aria-label="旅行者起点"></div>
      </section>
      <div class="caption">
        <span><i class="key"></i>谜题砖目前只有灰度</span>
        <strong>左侧小陆台 → 无护栏桥 → 灰度谜题 → 后方陆地</strong>
        <span>高台前沿为深色崖壁</span>
      </div>
    </div>
  </main>
  <script>
    const board = document.getElementById("board");
    for (let index = 0; index < 48; index += 1) {
      const tile = document.createElement("div");
      tile.className = "tile";
      board.appendChild(tile);
    }
  </script>
</body>
</html>
